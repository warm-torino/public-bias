<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Public Bias</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --mute:#8b949e;
          --long:#3fb950; --short:#f85149; --accent:#d29922; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg);
              font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); }
  .syms { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .syms::-webkit-scrollbar { display:none; }
  .syms button, .ranges button { background:var(--panel); color:var(--mute); border:1px solid var(--line);
      border-radius:6px; padding:7px 11px; font-size:14px; white-space:nowrap; cursor:pointer; }
  .syms button.on, .ranges button.on { color:var(--fg); border-color:var(--accent); }
  .head { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 16px; margin:8px 2px; }
  .head .sym { font-size:20px; font-weight:700; }
  .head .big { font-size:26px; font-weight:700; }
  .head .sub { font-size:13px; color:var(--mute); }
  .bar { height:8px; border-radius:4px; background:var(--short); overflow:hidden; margin:2px 2px 8px; }
  .bar > div { height:100%; background:var(--long); }
  #chart { position:relative; width:100%; height:62vh; min-height:340px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .legend { position:absolute; left:8px; z-index:3; font-size:12px; color:var(--mute); pointer-events:none; }
  #lgTop { top:6px; } #lgBot { top:64%; }
  .ranges { display:flex; gap:6px; margin-top:8px; }
  .note { font-size:12px; color:var(--mute); margin-top:10px; line-height:1.6; }
  .err { color:var(--short); }
</style>
</head>
<body>
<div class="wrap">
  <div class="syms" id="syms"></div>

  <div class="head">
    <span class="sym" id="hSym">—</span>
    <span class="big" id="hLong">—</span>
    <span class="sub" id="hChg"></span>
    <span class="sub" id="hPos"></span>
    <span class="sub" id="hTime"></span>
  </div>
  <div class="bar"><div id="hBar" style="width:50%"></div></div>

  <div id="chart">
    <div class="legend" id="lgTop"></div>
    <div class="legend" id="lgBot"></div>
  </div>

  <div class="ranges" id="ranges">
    <button data-d="3">3日</button>
    <button data-d="7" class="on">1週</button>
    <button data-d="30">1か月</button>
    <button data-d="0">全期間</button>
  </div>

  <div class="note" id="note">
    上：1時間足（Yahoo Finance・参考値。ゴールドは先物 GC=F）／下：リテールの買い比率（Myfxbook）。点線が50%。<br>
    時刻は日本時間。データは毎時05分ごろ更新（反映まで最大10分程度）。
  </div>
</div>

<script>
const JST = 9 * 3600;
const DAY = 86400;
let symbols = [], cur = null, rangeDays = 7, lastData = null;

const chartEl = document.getElementById('chart');
const chart = LightweightCharts.createChart(chartEl, {
  autoSize: true,
  layout: { background: { color: '#0d1117' }, textColor: '#8b949e', fontSize: 11 },
  grid: { vertLines: { color: '#1c2128' }, horzLines: { color: '#1c2128' } },
  rightPriceScale: { borderColor: '#30363d', scaleMargins: { top: 0.05, bottom: 0.4 } },
  timeScale: { borderColor: '#30363d', timeVisible: true, secondsVisible: false, rightOffset: 3 },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  localization: { locale: 'ja-JP' },
});

const candles = chart.addCandlestickSeries({
  upColor: '#3fb950', downColor: '#f85149', borderVisible: false,
  wickUpColor: '#3fb950', wickDownColor: '#f85149',
});

const sent = chart.addLineSeries({
  priceScaleId: 'sent', color: '#ff4d4d', lineWidth: 2,
  lineType: LightweightCharts.LineType.WithSteps,
  pointMarkersVisible: true, pointMarkersRadius: 2,
  priceFormat: { type: 'custom', formatter: v => v.toFixed(1) + '%' },
  autoscaleInfoProvider: orig => {
    const r = orig();
    if (!r || !r.priceRange) return { priceRange: { minValue: 40, maxValue: 60 } };
    return { priceRange: {
      minValue: Math.min(r.priceRange.minValue - 2, 45),
      maxValue: Math.max(r.priceRange.maxValue + 2, 55) } };
  },
});
chart.priceScale('sent').applyOptions({ scaleMargins: { top: 0.66, bottom: 0.03 } });
sent.createPriceLine({ price: 50, color: '#8b949e', lineWidth: 1,
  lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: false });

// ---------- CSV
async function getText(url) {
  const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.text();
}
function parseCsv(txt) {
  const lines = txt.trim().split(/\r?\n/);
  const head = lines.shift().split(',');
  return lines.map(l => { const c = l.split(','); const o = {}; head.forEach((h, i) => o[h] = c[i]); return o; });
}

async function loadSymbol(sym) {
  const out = { sent: [], price: [], rows: [] };
  try {
    const rows = parseCsv(await getText(`data/${sym}.csv`));
    out.rows = rows;
    const m = new Map();
    for (const r of rows) {
      const t = Math.floor(+r.utc_unix / 3600) * 3600;   // 価格の足に揃える
      const v = parseFloat(r.long_pct);
      if (!isNaN(v)) m.set(t, v);
    }
    out.sent = [...m].sort((a, b) => a[0] - b[0]).map(([t, v]) => ({ time: t + JST, value: v }));
  } catch (e) { out.sentErr = e.message; }
  try {
    const rows = parseCsv(await getText(`data/price/${sym}.csv`));
    out.price = rows.map(r => ({ time: +r.utc_unix + JST, open: +r.open, high: +r.high, low: +r.low, close: +r.close }))
                    .filter(b => !isNaN(b.close)).sort((a, b) => a.time - b.time);
  } catch (e) { out.priceErr = e.message; }
  return out;
}

// ---------- 表示
function fmtTime(unixUtc) {
  return new Date(unixUtc * 1000).toLocaleString('ja-JP',
    { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function digits(p) { return p < 50 ? 5 : p < 1000 ? 3 : 2; }

function header(sym, d) {
  document.getElementById('hSym').textContent = sym;
  const rows = d.rows;
  if (!rows.length) {
    ['hLong', 'hChg', 'hPos', 'hTime'].forEach(id => document.getElementById(id).textContent = '');
    document.getElementById('hLong').innerHTML = '<span class="err">データなし</span>';
    return;
  }
  const last = rows[rows.length - 1];
  const L = parseFloat(last.long_pct);
  document.getElementById('hLong').innerHTML =
    `<span style="color:var(--long)">買 ${L.toFixed(0)}%</span> <span style="color:var(--short)">売 ${(100 - L).toFixed(0)}%</span>`;
  document.getElementById('hBar').style.width = L + '%';

  const t0 = +last.utc_unix - DAY;
  let ref = null;
  for (const r of rows) if (+r.utc_unix <= t0 + 1800) ref = r;
  const chg = ref ? L - parseFloat(ref.long_pct) : null;
  document.getElementById('hChg').textContent =
    chg === null ? '24h変化 —' : `24h変化 ${chg >= 0 ? '+' : ''}${chg.toFixed(1)}pt`;
  document.getElementById('hPos').textContent = last.mfb_positions ? `ポジション数 ${(+last.mfb_positions).toLocaleString()}` : '';
  document.getElementById('hTime').textContent = `更新 ${fmtTime(+last.utc_unix)}`;
}

function applyRange() {
  const d = lastData;
  if (!d) return;
  const all = [...d.price.map(b => b.time), ...d.sent.map(p => p.time)];
  if (!all.length) return;
  const to = Math.max(...all), from = Math.min(...all);
  if (rangeDays === 0) chart.timeScale().fitContent();
  else chart.timeScale().setVisibleRange({ from: Math.max(from, to - rangeDays * DAY), to: to + 3600 });
}

async function show(sym) {
  cur = sym;
  document.querySelectorAll('#syms button').forEach(b => b.classList.toggle('on', b.dataset.s === sym));
  const d = await loadSymbol(sym);
  if (cur !== sym) return;
  lastData = d;
  candles.setData(d.price);
  if (d.price.length) {
    const dg = digits(d.price[d.price.length - 1].close);
    candles.applyOptions({ priceFormat: { type: 'price', precision: dg, minMove: Math.pow(10, -dg) } });
  }
  sent.setData(d.sent);
  header(sym, d);
  document.getElementById('lgTop').innerHTML = d.price.length ? '' : '<span class="err">価格データなし（次回の更新後に表示）</span>';
  applyRange();
  updateLegend(null);
}

function updateLegend(param) {
  const d = lastData; if (!d) return;
  let bar = null, s = null;
  if (param && param.time) {
    bar = param.seriesData.get(candles) || null;
    s = param.seriesData.get(sent) || null;
  } else {
    bar = d.price[d.price.length - 1] || null;
    s = d.sent[d.sent.length - 1] || null;
  }
  if (d.price.length) {
    const dg = bar ? digits(bar.close) : 2;
    document.getElementById('lgTop').textContent = bar ? `終値 ${bar.close.toFixed(dg)}` : '';
  }
  document.getElementById('lgBot').textContent = s ? `買い比率 ${s.value.toFixed(1)}%` : '';
}
chart.subscribeCrosshairMove(updateLegend);

document.getElementById('ranges').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  rangeDays = +b.dataset.d;
  document.querySelectorAll('#ranges button').forEach(x => x.classList.toggle('on', x === b));
  applyRange();
});

// ---------- 起動
(async () => {
  try {
    const cfg = JSON.parse(await getText('config.json'));
    symbols = cfg.symbols.map(s => s.toUpperCase());
  } catch (e) {
    symbols = ['EURUSD', 'GBPUSD', 'AUDUSD', 'USDJPY', 'EURJPY', 'GBPJPY', 'EURAUD', 'XAUUSD'];
  }
  const box = document.getElementById('syms');
  for (const s of symbols) {
    const b = document.createElement('button');
    b.textContent = s === 'XAUUSD' ? 'GOLD' : s; b.dataset.s = s;
    b.onclick = () => { try { localStorage.setItem('pb_sym', s); } catch (_) {} show(s); };
    box.appendChild(b);
  }
  let first = symbols[0];
  try { const s = localStorage.getItem('pb_sym'); if (s && symbols.includes(s)) first = s; } catch (_) {}
  show(first);
  setInterval(() => cur && show(cur), 10 * 60 * 1000);
})();
</script>
</body>
</html>
